<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f8f1" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch.png" />
  <title>Show Up · Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: #f9f8f1; color: #1b1c1a; font: 1rem/1.55 system-ui, sans-serif; }
    main { width: min(100%, 30rem); margin: auto; padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) 1.5rem max(1.5rem, env(safe-area-inset-left)); }
    img { display: block; }
    h1 { font-size: clamp(2rem, 9vw, 3.35rem); line-height: 1.04; letter-spacing: -.055em; margin: 1.25rem 0 .65rem; }
    p { color: #595a52; margin: 0 0 1.3rem; }
    button { border: 0; border-radius: 7px; padding: .75rem 1.05rem; min-height: 44px; background: #233bd5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid #233bd5; outline-offset: 3px; }
    footer { color: #6b6b61; font-size: .625rem; text-align: center; padding: .7rem 1rem max(.7rem, env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <main>
    <img src="/mark.svg" width="42" height="42" alt="Show Up" />
    <h1>You’re offline.</h1>
    <p>Reconnect to open your pacts and log a check-in. Show Up will try again when you’re back online.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <footer>made by anvi karanjkar</footer>
  <script defer src="/reconnect.js"></script>
</body>
</html>
